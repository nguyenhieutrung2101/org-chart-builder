# Gate chất lượng cho mọi PR / push: cú pháp từng file js, tầng logic + fuzz (Node), rồi toàn bộ suite Playwright trên Chromium.
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node tests/run.mjs logic
      - run: npx playwright install --with-deps chromium
      - run: npm test
